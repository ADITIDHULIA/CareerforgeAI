services:
  postgres:
    image: postgres:16-alpine
    container_name: careerforge-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careerforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerforge_secret}
      POSTGRES_DB: ${POSTGRES_DB:-careerforge_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careerforge} -d ${POSTGRES_DB:-careerforge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - careerforge-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerforge-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-careerforge}:${POSTGRES_PASSWORD:-careerforge_secret}@postgres:5432/${POSTGRES_DB:-careerforge_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-careerforge-docker-jwt-secret-replace-in-prod-2026}
      JWT_EXPIRES_IN: 7d
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - careerforge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: careerforge-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - careerforge-network

volumes:
  postgres_data:
    name: careerforge_postgres_data
  backend_uploads:
    name: careerforge_backend_uploads

networks:
  careerforge-network:
    name: careerforge-network
    driver: bridge
